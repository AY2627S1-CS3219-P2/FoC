openapi: 3.1.0
info:
  title: Credit Service API
  version: 0.2.0
  description: Public credit reads and private reservation commands.
servers:
  - url: http://localhost:8084
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorCode:
      type: string
      enum: [INVALID_REQUEST, WALLET_NOT_READY, INSUFFICIENT_CREDITS, RESERVATION_NOT_FOUND, RESERVATION_STATE_CONFLICT, IDEMPOTENCY_CONFLICT, ACCOUNT_INTEGRITY_FAILURE, CREDIT_LIMIT_EXCEEDED, SERVICE_UNAVAILABLE, INTERNAL_ERROR]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unhealthy]
    CreditStatus:
      type: string
      enum: [READY, TEMPORARILY_UNAVAILABLE]
    AccountResponse:
      type: object
      additionalProperties: false
      required: [userId, creditStatus, updatedAt]
      properties:
        userId:
          type: string
          format: uuid
        creditStatus:
          $ref: "#/components/schemas/CreditStatus"
        availableCredits:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000
        reservedCredits:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000
        updatedAt:
          type: string
          format: date-time
    CreateReservationRequest:
      type: object
      additionalProperties: false
      required: [errandId, amount]
      properties:
        errandId:
          type: string
          format: uuid
        requesterId:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
    AdjustRewardRequest:
      type: object
      additionalProperties: false
      required: [newReward]
      properties:
        newReward:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
    ReservationStatus:
      type: string
      enum: [RESERVED, PAID_OUT, REFUNDED]
    ReservationResponse:
      type: object
      additionalProperties: false
      required: [id, errandId, requesterId, amount, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        errandId:
          type: string
          format: uuid
        requesterId:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
        status:
          $ref: "#/components/schemas/ReservationStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TransactionReason:
      type: string
      enum: [REGISTRATION_ALLOCATION, ERRAND_RESERVATION, ERRAND_FAILED, ERRAND_COMPLETED_PAYOUT, ERRAND_COMPLETED_DEDUCTION, ERRAND_CANCELLED, ERRAND_EXPIRED, REWARD_INCREASED, REWARD_DECREASED]
    TransactionOperation:
      type: object
      additionalProperties: false
      required: [operationId, reason, availableDelta, reservedDelta, createdAt]
      properties:
        operationId:
          type: string
          format: uuid
        errandId:
          type: [string, "null"]
          format: uuid
        reason:
          $ref: "#/components/schemas/TransactionReason"
        availableDelta:
          type: integer
          format: int64
        reservedDelta:
          type: integer
          format: int64
        occurredAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    TransactionListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TransactionOperation"
        nextCursor:
          type: [string, "null"]
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Existing reservation has conflicting parameters (mismatched requester or amount), or is in a non-reservable terminal state (PAID_OUT or REFUNDED), or command conflicts with current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableContent:
      description: Credits are insufficient or a credit limit would be exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required dependency or financial operation is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected internal failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

paths:
  /health/live:
    get:
      summary: Check process liveness.
      operationId: getLiveness
      security: []
      responses:
        "200":
          description: Process is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      summary: Check service readiness.
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/credits/reservations:
    post:
      summary: Reserve requester credits for an errand.
      operationId: createReservation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
      responses:
        "200":
          description: Existing identical reservation (idempotent retry).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "201":
          description: Reservation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/credits/reservations/{errandId}:
    patch:
      summary: Adjust the reward secured by a reservation.
      operationId: adjustReservationReward
      security: []
      parameters:
        - in: path
          name: errandId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustRewardRequest"
      responses:
        "200":
          description: Stored command result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/credits/accounts/me:
    get:
      summary: Get the authenticated user's credit account.
      operationId: getMyCreditAccount
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Credit account status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/credits/accounts/me/transactions:
    get:
      summary: List the authenticated user's grouped financial operations.
      operationId: listMyCreditTransactions
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - in: query
          name: cursor
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Grouped credit transaction history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
