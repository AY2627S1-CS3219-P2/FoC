# AI Assistance Disclosure:
# Tool: Claude Code (model: Opus 5), date: 2026-09-19
# Scope: Compose baseline — extends the supplier-service/frontend stack from
#   PR #1 with Redis and the API Gateway, and closes the public ports that
#   ai/decisions.md D-010 says must be internal. 2026-09-22: merge with main,
#   which landed PR #1's half of this file; comments brought up to date. Later
#   that day: the frontend service was removed — the gateway serves the built
#   SPA, so the browser has one origin (D-033).
# Author review: PENDING — <reviewer to complete>

# The trust zones from ai/decisions.md D-010 are enforced here by ONE thing:
# whether a service has a `ports:` key. A published port is reachable from the
# host; everything else is reachable only by name, from inside this network.
#
#   published   api-gateway, as 3001 — it serves the browser app AND the API
#   internal    redis, supplier-db, and every service
#
# Services with no code yet (user-service, order-service, credit-service) are
# deliberately absent — they have Dockerfiles but nothing to build, and listing
# them would break `docker compose up`. Add each one as it lands.
#
# user-service is absent here but exists on feat/user-service, with its own
# compose half (user-db, redis, user-service). Merging the two halves is
# blocked on ai/decisions.md D-024 versus user-service/AGENTS.md — see the
# note on redis below.

services:
  # ---- Revocation store (D-013, D-014) ------------------------------------
  # AI-generated (edited by PENDING) — rewritten for D-024.
  # user-service is the ONLY process that touches this; the gateway is not a
  # Redis client at all (D-024). Nothing consumes it in this file yet because
  # user-service is not in this half — it is here so the store exists when the
  # two halves merge. NOTE: feat/user-service's compose declares redis:8-alpine
  # with no persistence and no volume, which would empty the jti blocklist on
  # restart. That difference has to be settled before the halves are merged.
  # No `ports:` key, so nothing outside this network can reach it — which
  # matters because write access is enough to un-revoke a logged-out token.
  redis:
    image: redis:7-alpine
    # Append-only persistence: without it a restart empties the jti blocklist,
    # silently un-revoking every token that was logged out before the restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- The only public entry point (D-010) --------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    # No depends_on: the gateway is not a Redis client (D-024), and it fetches
    # JWKS lazily rather than requiring user-service at boot (root AGENTS.md
    # §5 — never assume startup order).
    environment:
      PORT: 8080
      # user-service's public keys (D-023). While user-service is absent the
      # gateway still starts; authenticated routes answer 503 until it appears.
      JWKS_URL: http://user-service:8081/.well-known/jwks.json
      # config.Load requires all four, so a missing one fails at boot rather
      # than at the first request that needs it. Services that do not exist
      # yet can still be named.
      USER_BASE_URL: http://user-service:8081
      SUPPLIER_BASE_URL: http://supplier-service:8082
      ORDER_BASE_URL: http://order-service:8083
      CREDIT_BASE_URL: http://credit-service:8084
      # The refresh cookie's Max-Age. MUST match user-service's
      # JWT_REFRESH_TOKEN_TTL — the gateway owns the cookie, not the token.
      REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-168h}
      # The built SPA, baked into the image by api-gateway/Dockerfile. This is
      # what makes the page and the API one origin, which a SameSite=Strict
      # cookie requires (D-033).
      STATIC_DIR: /app/web
    # Published as 3001 — the frontend's allocation in root AGENTS.md §3 —
    # because this is now the only thing the browser talks to. 8080 remains
    # the in-container port (D-018).
    ports:
      - "3001:8080"

  # ---- Supplier service and its own database (D-003) ----------------------
  supplier-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supplier
    volumes:
      - supplier-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  supplier-service:
    build:
      context: .
      dockerfile: supplier-service/Dockerfile
    depends_on:
      supplier-db:
        condition: service_healthy
    environment:
      PORT: 8082
      SUPPLIER_DB_URL: postgres://postgres:postgres@supplier-db:5432/supplier?sslmode=disable
    # TRANSITIONAL — D-010 says this must not be published. The gateway now
    # proxies /api/suppliers correctly onto supplier-service's own /suppliers
    # prefix, so nothing here needs the published port any more; what still
    # does is the frontend, which reads VITE_SUPPLIER_BASE_URL and addresses
    # :8082 directly. Delete these two lines in the same change that points
    # the frontend at the gateway (D-025b); until then the zones in the
    # architecture diagram are not actually enforced for this service.
    ports:
      - "8082:8082"

  # ---- Browser client ------------------------------------------------------
  # ---- Browser client ------------------------------------------------------
  # There is no frontend service any more. api-gateway/Dockerfile builds the
  # SPA and the gateway serves it from "/", so the browser has ONE origin and
  # the SameSite=Strict refresh cookie rides along without any CORS (D-033).
  #
  # frontend/Dockerfile and frontend/nginx.conf are kept rather than deleted:
  # D-033 says to bring nginx back only if serving from the gateway proves
  # unworkable, and to flag that rather than doing it silently.

volumes:
  redis-data:
  supplier-db-data:
