services:
  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: user
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    environment:
      PORT: 8081
      USER_DB_URL: postgres://postgres:postgres@user-db:5432/user?sslmode=disable
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set}
      JWT_KEYSET_PATH: /app/keys.json
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:?JWT_ACCESS_TOKEN_TTL must be set}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:?JWT_REFRESH_TOKEN_TTL must be set}
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    restart: on-failure

volumes:
  user-db-data:
