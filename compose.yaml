services:
  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: user
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PW:?DB_PW must be set}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    environment:
      PORT: 8081
      USER_DB_URL: postgres://postgres:postgres@user-db:5432/user?sslmode=disable
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set}
      JWT_KEYSET_PATH: /app/keys.json
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-168h}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?INITIAL_ADMIN_EMAIL must be set}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:?INITIAL_ADMIN_USERNAME must be set}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD must be set}
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    restart: on-failure

  supplier-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supplier
    volumes:
      - supplier-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]

  supplier-service:
    build:
      context: .
      dockerfile: supplier-service/Dockerfile
    depends_on:
      supplier-db:
        condition: service_healthy
    environment:
      PORT: 8082
      SUPPLIER_DB_URL: postgres://postgres:postgres@supplier-db:5432/supplier?sslmode=disable
    ports:
      - "8082:8082"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - supplier-service
    ports:
      - "3001:80"


volumes:
  user-db-data:
  supplier-db-data:
