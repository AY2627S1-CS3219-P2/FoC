# AI Assistance Disclosure:
# Tool: Claude Code (model: Opus 5.5), date: 2026-10-14
# Scope: Wrote order-service's HTTP contract: routes, request and response
#   shapes, errors and authentication.
# Author review: James Teo — reviewed and verified.

openapi: 3.1.0
info:
  title: order-service
  version: 0.1.0
  description: |
    The errand lifecycle (requirements in `order-service/docs/requirements.md`).

    The browser reaches these routes through the API Gateway as `/api/orders`
    plus the path below; the gateway strips that prefix.

    Every route except `/health` needs `Authorization: Bearer <access token>`,
    the token `user-service` issued. order-service verifies it itself:
    the RS256 signature against `user-service`'s published keys, its issuer
    (`campusrun-user-service`) and audience (`campusrun-api`), its expiry,
    and that `user-service` has not revoked it. The caller is the
    token's `sub` and `role` (`STUDENT` or `ADMIN`); `X-User-Id` and
    `X-User-Role` are ignored. A missing, invalid, expired or revoked token is
    401. When `user-service`'s keys cannot be loaded, or Redis answers the
    revocation lookup with an error, the answer is 503.

    `X-Request-Id` is the correlation id for logs and events. On `POST /` it is
    also the duplicate-submission key: a create whose key the server has already
    seen for that requester returns 200 with the existing errand and touches no
    credits.

    Errors are `{"error": "<message>"}`. Times are RFC 3339 in UTC.
servers:
  - url: http://localhost:8083

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and database readiness
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database cannot be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /:
    post:
      operationId: createErrand
      summary: Post an errand (F3.1)
      # AI-generated (edited by PENDING): the last paragraph, D-093's rating gate.
      description: |
        Validates the reward, supplier and delivery location, reserves the reward
        through credit-service, then saves the errand in `OPEN`. A requester who
        already has 5 errands `OPEN` before their deadlines cannot post another:
        the create is refused with 409.

        A student with a `COMPLETED` errand they have not yet rated cannot post
        either: 409, until they rate it (D-093). `GET /ratings/pending` lists them.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateErrandRequest"
      responses:
        "201":
          description: Errand created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrandDetail"
        "200":
          description: The same `X-Request-Id` was already used by this requester; the errand it created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrandDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The requester already has 5 errands `OPEN` before their deadlines, or has a completed errand to rate first (D-093), so cannot post another
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          $ref: "#/components/responses/InsufficientCredits"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: listActiveErrands
      summary: Every errand that is not final (ADMIN only)
      description: Oldest state change first, so stalled errands come first. At most 100.
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [active]
      responses:
        "200":
          description: Errands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrandList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /open:
    get:
      operationId: listOpenErrands
      summary: Errands couriers can accept (F3.2)
      # AI-generated (edited by PENDING): D-094's recommendation and its
      # parameter; trained while the courier opens Find errands (D-099).
      description: |
        Only `OPEN` errands that have not passed their deadline, most recent
        first. At most 100.

        For a student who has completed at least 2 errands, the list also
        carries `recommendation`: the errand their own model, trained on what
        they were shown and took, scores highest, with its confidence and
        reason (D-094). Asking for it may train and save the model, in
        user-service, with the caller's token (D-099). A failure there leaves
        the list as it is, without a recommendation. `recommend=false` turns it
        off.
      parameters:
        - name: recommend
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Errands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrandList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /requested:
    get:
      operationId: listRequestedErrands
      summary: The caller's own errands (F3.4)
      description: |
        `active` lists the caller's errands that are not final (F3.4.1);
        `history` lists the completed, cancelled and expired ones, most recent
        first, at most 50 (F3.4.3).
      parameters:
        - $ref: "#/components/parameters/Scope"
      responses:
        "200":
          description: Errands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrandList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /assigned:
    get:
      operationId: listAssignedErrands
      summary: Errands the caller accepted as courier (F3.5)
      description: |
        `active` fills `items` with the caller's assignments that are not final
        (F3.5.1). `history` fills `history` with ended assignments: completed,
        cancelled, and released by withdrawal (F3.5.3), most recent first, at
        most 50.
      parameters:
        - $ref: "#/components/parameters/Scope"
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignedList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /locations:
    get:
      operationId: listDeliveryLocations
      summary: The campus delivery locations an errand may name
      responses:
        "200":
          description: Locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /suppliers/{supplierId}/active-errands:
    get:
      operationId: countSupplierActiveErrands
      summary: How many errands that are not final reference a supplier (F2.2.3)
      description: Called by supplier-service before it deletes a supplier, with the admin's access token. Only an ADMIN may call it.
      parameters:
        - name: supplierId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierActiveErrands"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /{errandId}:
    parameters:
      - $ref: "#/components/parameters/ErrandId"
    get:
      operationId: getErrand
      summary: One errand with its history (F3.6)
      description: |
        Visible to its requester, its assigned courier and ADMIN, and to any
        signed-in user while it is `OPEN` (F3.6.2). Anyone else gets 404 (F3.6.3).
      responses:
        "200":
          description: The errand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrandDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: amendErrand
      summary: Amend an `OPEN` errand (requester only, F3.7)
      description: |
        Send `version` plus only the fields to change. A reward change adjusts the
        credit reservation. The deadline does not move (F3.7.6).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmendErrandRequest"
      responses:
        "200":
          description: The amended errand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrandDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          $ref: "#/components/responses/InsufficientCredits"
        "503":
          $ref: "#/components/responses/Unavailable"

  /{errandId}/accept:
    parameters:
      - $ref: "#/components/parameters/ErrandId"
    post:
      operationId: acceptErrand
      summary: Accept an `OPEN` errand as its courier (F3.3)
      description: |
        Send the `version` you were shown; if the errand changed since, the answer
        is 409. A courier who withdrew from an errand cannot accept it again: the
        answer is 409, and the errand's `actions` never offer them `accept`.
        A courier with a `COMPLETED` errand they have not yet rated is refused
        with 409 until they rate it (D-093).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRequest"
      responses:
        "200":
          $ref: "#/components/responses/ErrandAfterAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"

  /{errandId}/withdraw:
    parameters:
      - $ref: "#/components/parameters/ErrandId"
    post:
      operationId: withdrawErrand
      summary: The assigned courier gives an `ACCEPTED` errand back (F3.12)
      responses:
        "200":
          $ref: "#/components/responses/ErrandAfterAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /{errandId}/pickup:
    parameters:
      - $ref: "#/components/parameters/ErrandId"
    post:
      operationId: pickUpErrand
      summary: The assigned courier marks the item picked up (F3.8)
      responses:
        "200":
          $ref: "#/components/responses/ErrandAfterAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /{errandId}/deliver:
    parameters:
      - $ref: "#/components/parameters/ErrandId"
    post:
      operationId: deliverErrand
      summary: The assigned courier marks the errand delivered (F3.9)
      responses:
        "200":
          $ref: "#/components/responses/ErrandAfterAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /{errandId}/confirm:
    parameters:
      - $ref: "#/components/parameters/ErrandId"
    post:
      operationId: confirmErrand
      summary: The requester confirms delivery (F3.9.2, F3.9.3)
      responses:
        "200":
          $ref: "#/components/responses/ErrandAfterAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /{errandId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ErrandId"
    post:
      operationId: cancelErrand
      summary: Cancel an errand (F3.11)
      description: The requester may cancel while `OPEN`; ADMIN may cancel any errand that is not final.
      responses:
        "200":
          $ref: "#/components/responses/ErrandAfterAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /{errandId}/complete:
    parameters:
      - $ref: "#/components/parameters/ErrandId"
    post:
      operationId: completeErrand
      summary: ADMIN completes a `PICKED_UP` or `DELIVERED` errand
      responses:
        "200":
          $ref: "#/components/responses/ErrandAfterAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # AI-generated (edited by PENDING): D-093's ratings and D-092's shown and
  # search records. Paths and field names were left to the implementation;
  # for Nigeltzy and James Teo to confirm in review.
  /{errandId}/rating:
    parameters:
      - $ref: "#/components/parameters/ErrandId"
    post:
      operationId: rateErrand
      summary: The requester rates the courier, or the courier the requester, after a `COMPLETED` errand (D-093)
      description: |
        Each side rates the other once, 1 to 5 stars, and cannot change it. Only
        a student who was the errand's requester or courier may rate it, and only
        once it is `COMPLETED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateRequest"
      responses:
        "201":
          description: The rating as saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rating"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The errand is not `COMPLETED`, or the caller has already rated it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/TooLarge"

  /ratings/pending:
    get:
      operationId: listPendingRatings
      summary: The caller's `COMPLETED` errands they have not rated yet, most recent first (D-093)
      description: While this list is not empty, the caller can neither post nor accept an errand.
      responses:
        "200":
          description: Errands to rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingRatingList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{userId}/rating:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getUserRating
      summary: The ratings a user has received, as requester and as courier together (D-093)
      description: Public to any signed-in user. A user nobody has rated has a `count` of 0 and no `average`.
      responses:
        "200":
          description: The user's rating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRating"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /activity/shown:
    post:
      operationId: recordShownErrands
      summary: Records the errands whose whole card came into a courier's view on Find errands (D-092)
      description: |
        The caller is the courier. An errand id order-service does not know is
        skipped. Recorded for errand ranking (D-088); nothing is sent back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShownRequest"
      responses:
        "204":
          description: Recorded
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/TooLarge"

  /activity/searches:
    post:
      operationId: recordSearch
      summary: Records the filters a courier set on Find errands (D-092)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "204":
          description: Recorded
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/TooLarge"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An access token issued by user-service, verified by order-service itself.

  parameters:
    ErrandId:
      name: errandId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Scope:
      name: scope
      in: query
      required: true
      schema:
        type: string
        enum: [active, history]
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Correlation id; on create, also the duplicate-submission key.
      schema:
        type: string
        maxLength: 64

  responses:
    ErrandAfterAction:
      description: The errand after the action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrandDetail"
    BadRequest:
      description: The request is malformed or fails validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The access token is missing, invalid, expired or revoked
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller's relationship to this errand, or their role, does not allow the action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such errand, or the caller may not see it
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The errand's state, version or deadline does not allow the action now, or the courier already holds K active errands
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: The request body is too large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InsufficientCredits:
      description: credit-service reports that the requester's available credits do not cover the reward
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: supplier-service or credit-service did not answer; nothing was changed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unhealthy]

    ErrandState:
      type: string
      enum: [OPEN, ACCEPTED, PICKED_UP, DELIVERED, COMPLETED, CANCELLED, EXPIRED]

    ErrandAction:
      description: An action the viewer may take now; each maps to the route of the same name.
      type: string
      enum: [amend, accept, withdraw, pickup, deliver, confirm, cancel, complete]

    HistoryAction:
      type: string
      enum: [CREATE, AMEND, ACCEPT, WITHDRAW, PICK_UP, DELIVER, CONFIRM, AUTO_CONFIRM, CANCEL, EXPIRE, ADMIN_CANCEL, ADMIN_COMPLETE]

    SupplierSnapshot:
      description: The supplier as it was when the errand was posted or last amended.
      type: object
      required: [id, name, location]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        location:
          type: string

    Errand:
      type: object
      required: [id, state, version, supplier, itemDescription, deliveryLocation, reward, createdAt, updatedAt, stateChangedAt, actions]
      properties:
        id:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/ErrandState"
        version:
          type: integer
          description: Send this back on amend and accept.
        supplier:
          $ref: "#/components/schemas/SupplierSnapshot"
        itemDescription:
          type: string
        deliveryLocation:
          type: string
        deliveryNote:
          type: string
          description: Present only for the requester, the assigned courier and ADMIN.
        reward:
          type: integer
        requesterId:
          type: string
          format: uuid
          # AI-generated (edited by PENDING): D-093 puts the requester's name on Find errands cards.
          description: Present for the requester, the assigned courier and ADMIN, and to any student while the errand is `OPEN` (D-093).
        courierId:
          type: string
          format: uuid
          description: Present while a courier is assigned.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        stateChangedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Present while `OPEN` (F3.2.3).
        confirmBy:
          type: string
          format: date-time
          description: Present while `DELIVERED`; the errand completes on its own after this (F3.4.2, F3.9.4).
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ErrandAction"

    FieldChange:
      type: object
      required: [field, from, to]
      properties:
        field:
          type: string
          enum: [supplier, itemDescription, deliveryLocation, deliveryNote, reward]
        from:
          type: string
        to:
          type: string

    HistoryEntry:
      type: object
      required: [action, toState, occurredAt]
      properties:
        action:
          $ref: "#/components/schemas/HistoryAction"
        fromState:
          $ref: "#/components/schemas/ErrandState"
        toState:
          $ref: "#/components/schemas/ErrandState"
        occurredAt:
          type: string
          format: date-time
        changes:
          description: |
            Present on AMEND entries (F3.7.7). A `deliveryNote` change is left out
            for a viewer who may not see the note, and shown to the assigned
            courier with empty `from` and `to`.
          type: array
          items:
            $ref: "#/components/schemas/FieldChange"

    ErrandDetail:
      type: object
      required: [errand, history, serverTime]
      properties:
        errand:
          $ref: "#/components/schemas/Errand"
        history:
          type: array
          items:
            $ref: "#/components/schemas/HistoryEntry"
        serverTime:
          type: string
          format: date-time

    ErrandList:
      type: object
      required: [items, serverTime]
      properties:
        items:
          type: array
          items:
